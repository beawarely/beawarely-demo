<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Your Profile – BeAwarely</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.44.4/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-client.js"></script>
      <style>
    :root{
      /* Holo-ID / glass terminal (inna estetyka niż suggest.html) */
      --bg0:#050611;
      --bg1:#0a0c1c;

      --text:#edf3ff;
      --muted:rgba(237,243,255,.72);

      --a:#7df9ff;   /* ice cyan */
      --b:#a78bfa;   /* violet */
      --c:#34d399;   /* mint */
      --d:#fb7185;   /* rose */

      --panel:rgba(10,12,24,.62);
      --card:rgba(8,10,20,.54);
      --line:rgba(237,243,255,.14);
      --line2:rgba(237,243,255,.10);

      --r:18px;
      --r2:24px;

      --shadow: 0 26px 90px rgba(0,0,0,.58);
      --shadow2: 0 12px 30px rgba(0,0,0,.32);
      --ring: rgba(125,249,255,.34);
    }

    *{ box-sizing:border-box; }
    html, body{ height:100%; }

    body{
      margin:0;
      padding:56px 16px 80px;
      min-height:100vh;
      color:var(--text);
      text-align:center;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      overflow-x:hidden;

      /* "terminal glass": ciemny gradient + mikropunkty + delikatny hologram */
      background:
        radial-gradient(1000px 650px at 18% 10%, rgba(125,249,255,.16), transparent 62%),
        radial-gradient(900px 620px at 86% 14%, rgba(167,139,250,.14), transparent 62%),
        radial-gradient(900px 680px at 50% 120%, rgba(52,211,153,.10), transparent 62%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      background-attachment: fixed;
    }

    /* dot-matrix */
    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:.22;
      background:
        radial-gradient(circle, rgba(255,255,255,.14) 0 1px, transparent 1.5px);
      background-size: 22px 22px;
      mix-blend-mode: overlay;
    }

    /* hologram sweep */
    body::after{
      content:"";
      position:fixed;
      inset:-20% -10%;
      pointer-events:none;
      opacity:.18;
      background:
        linear-gradient(110deg,
          transparent 0%,
          rgba(125,249,255,.20) 14%,
          transparent 28%,
          rgba(167,139,250,.14) 44%,
          transparent 58%,
          rgba(251,113,133,.10) 74%,
          transparent 100%);
      transform: rotate(8deg);
      filter: blur(10px);
      animation: holoSweep 10.5s ease-in-out infinite alternate;
    }

    @keyframes holoSweep{
      0%{ transform: translate3d(-2%, -1%, 0) rotate(8deg); }
      100%{ transform: translate3d(2%, 1%, 0) rotate(12deg); }
    }

    @media (prefers-reduced-motion: reduce){
      body::after{ animation:none; }
      .back-btn, .profile-pic, .feed-item, .friend-row, .btn{ transition:none !important; }
    }

    .back-btn{
      position:fixed;
      top:14px;
      left:14px;
      z-index:10;

      appearance:none;
      cursor:pointer;

      padding:10px 14px;
      border-radius:999px;
      border:1px solid transparent;

      color:var(--text);
      background:
        linear-gradient(var(--panel), var(--panel)) padding-box,
        linear-gradient(135deg, rgba(125,249,255,.60), rgba(167,139,250,.52), rgba(52,211,153,.45)) border-box;
      backdrop-filter: blur(12px);

      box-shadow: var(--shadow2);
      transition: transform .14s ease, box-shadow .18s ease, filter .18s ease;
    }
    .back-btn:hover{
      transform: translateY(-1px);
      filter: saturate(1.08);
      box-shadow: var(--shadow);
    }
    .back-btn:focus-visible{
      outline:2px solid var(--ring);
      outline-offset:2px;
    }

    .profile-box{
      max-width: 880px;
      margin: 68px auto 0;
      text-align:center;

      padding: 34px 26px;
      border-radius: var(--r2);
      border: 1px solid rgba(237,243,255,.12);

      background: rgba(10,12,24,.52);
      backdrop-filter: blur(14px);
      box-shadow: var(--shadow);

      position:relative;
      overflow:hidden;
      isolation:isolate;
    }

    /* animated border aura (bez mask/clip hacków) */
    .profile-box::before{
      content:"";
      position:absolute;
      inset:-2px;
      z-index:-1;
      background: conic-gradient(
        from 220deg,
        rgba(125,249,255,.55),
        rgba(167,139,250,.45),
        rgba(52,211,153,.35),
        rgba(251,113,133,.30),
        rgba(125,249,255,.55)
      );
      filter: blur(18px);
      opacity:.35;
      animation: auraSpin 14s linear infinite;
    }

    @keyframes auraSpin{
      to{ transform: rotate(360deg); }
    }

    /* top label */
    .profile-box .email,
    .profile-box h1,
    .profile-box .stats,
    .profile-box .badges,
    .profile-box .btn-group,
    .profile-box .upload-wrap,
    .profile-box .section{
      position:relative;
      z-index:1;
    }

    .profile-pic{
      width:140px;
      height:140px;
      object-fit:cover;
      display:inline-block;
      margin:10px 0 12px;

      border-radius: 22px;
      border: 1px solid rgba(237,243,255,.14);

      box-shadow:
        0 18px 52px rgba(0,0,0,.60),
        0 0 0 6px rgba(125,249,255,.10),
        0 0 0 12px rgba(167,139,250,.06);

      transition: transform .16s ease, box-shadow .22s ease, filter .22s ease;
      filter: saturate(1.06) contrast(1.02);
    }
    .profile-pic:hover{
      transform: translateY(-2px) rotate(-.2deg);
      box-shadow:
        0 22px 66px rgba(0,0,0,.66),
        0 0 0 7px rgba(52,211,153,.12),
        0 0 0 13px rgba(251,113,133,.07);
    }

    h1{
      margin: 8px 0 4px;
      font-size: clamp(1.9rem, 2.7vw, 2.35rem);
      letter-spacing: .2px;

      background: linear-gradient(90deg, rgba(125,249,255,1), rgba(167,139,250,1), rgba(52,211,153,1));
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;

      text-shadow: 0 14px 44px rgba(125,249,255,.10);
    }

    .email{
      font-size:.98rem;
      color:var(--muted);
      margin-bottom:18px;
      word-break:break-word;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      opacity:.95;
    }

    .stats{
      display:grid;
      grid-template-columns: repeat(3, minmax(160px, 1fr));
      gap:14px;
      margin:12px 0 20px;
      font-size:.95rem;
    }
    @media (max-width:720px){ .stats{ grid-template-columns:1fr 1fr; } }
    @media (max-width:440px){ .stats{ grid-template-columns:1fr; } }

    .stat{
      border-radius: var(--r);
      padding: 12px 10px;
      border: 1px solid rgba(237,243,255,.12);
      background: rgba(8,10,20,.46);
      box-shadow: var(--shadow2);
      backdrop-filter: blur(10px);
      position:relative;
      overflow:hidden;
    }
    .stat::after{
      content:"";
      position:absolute;
      inset:-40% -25%;
      background:
        radial-gradient(circle at 22% 28%, rgba(125,249,255,.16), transparent 58%),
        radial-gradient(circle at 76% 72%, rgba(167,139,250,.12), transparent 62%);
      transform: rotate(12deg);
      opacity:.8;
      pointer-events:none;
    }
    .stat strong{
      display:block;
      font-size:1.22rem;
      margin-top:6px;
    }

    .trust-bar{
      width:86%;
      margin:8px auto 10px;
      height:10px;
      border-radius:999px;
      overflow:hidden;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(237,243,255,.10);
      box-shadow: inset 0 1px 2px rgba(0,0,0,.35);
    }
    .trust-fill{
      height:100%;
      width:0%;
      border-radius:999px;
      background: linear-gradient(90deg, rgba(125,249,255,1), rgba(52,211,153,1));
      transition: width .35s ease;
    }

    .badges{
      margin:14px 0 22px;
      display:flex;
      justify-content:center;
      flex-wrap:wrap;
      gap:10px;
    }
    .badge{
      padding:7px 12px;
      border-radius: 999px;
      font-size:.85rem;
      white-space:nowrap;
      color: rgba(237,243,255,.92);

      border: 1px solid rgba(237,243,255,.12);
      background: rgba(8,10,20,.46);
      box-shadow: 0 10px 26px rgba(0,0,0,.28);
      backdrop-filter: blur(10px);
    }

    .btn-group{
      display:flex;
      justify-content:center;
      gap:12px;
      flex-wrap:wrap;
    }

    .btn{
      appearance:none;
      min-width:140px;
      padding:11px 18px;
      cursor:pointer;

      border-radius: 14px;
      border: 1px solid transparent;

      color: #071022;
      font-size:.95rem;
      font-weight:800;
      letter-spacing:.2px;

      background:
        linear-gradient(180deg, rgba(255,255,255,.26), rgba(255,255,255,0)) padding-box,
        linear-gradient(135deg, rgba(125,249,255,1), rgba(167,139,250,1)) border-box;

      box-shadow: 0 14px 34px rgba(0,0,0,.40);
      transition: transform .12s ease, box-shadow .18s ease, filter .18s ease;
    }
    .btn:hover{
      transform: translateY(-1px);
      filter: saturate(1.06);
      box-shadow: 0 18px 54px rgba(0,0,0,.48);
    }
    .btn:active{ transform: translateY(0px) scale(.99); }

    .btn.secondary{
      color: var(--text);
      border-color: rgba(237,243,255,.14);
      background: rgba(8,10,20,.46);
      box-shadow: var(--shadow2);
      backdrop-filter: blur(10px);
    }
    .btn.secondary:hover{
      filter: brightness(1.05);
      box-shadow: var(--shadow);
    }

    /* New Post: override inline styling */
    #new-post-content{
      width:100% !important;
      padding:12px 14px !important;
      border-radius:16px !important;
      background: rgba(8,10,20,.46) !important;
      color: var(--text) !important;

      border: 1px solid rgba(237,243,255,.12) !important;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.04) !important;
      outline:none !important;
      resize: vertical;
    }
    #new-post-content:focus{
      border-color: rgba(125,249,255,.35) !important;
      box-shadow: 0 0 0 3px rgba(125,249,255,.14), inset 0 0 0 1px rgba(255,255,255,.05) !important;
    }

    #post-visibility{
      background: rgba(8,10,20,.46) !important;
      color: var(--text) !important;
      border: 1px solid rgba(237,243,255,.12) !important;
      border-radius:999px !important;
      padding:8px 12px !important;
      box-shadow: var(--shadow2) !important;
      outline:none !important;
      backdrop-filter: blur(10px) !important;
    }
    #post-visibility:focus{
      border-color: rgba(167,139,250,.35) !important;
      box-shadow: 0 0 0 3px rgba(167,139,250,.14), var(--shadow2) !important;
    }

    .upload-wrap{
      margin-top:26px;
      padding-top:18px;
      border-top: 1px dashed rgba(237,243,255,.14);
    }
    .helper{
      font-size:.9rem;
      color:var(--muted);
      margin-top:8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }
    .sr{ position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden; }

    .section{
      margin-top:26px;
      padding-top:18px;
      border-top: 1px dashed rgba(237,243,255,.14);
      text-align:left;
    }
    .section h2{
      font-size:1.05rem;
      margin:0 0 12px;
      display:flex;
      align-items:center;
      gap:10px;
      letter-spacing:.08em;
      text-transform:uppercase;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      color: rgba(237,243,255,.90);
    }

    .feed{ display:flex; flex-direction:column; gap:10px; }
    .feed-item{
      border-radius: var(--r);
      padding: 10px 12px;
      border: 1px solid rgba(237,243,255,.12);
      background: rgba(8,10,20,.46);
      box-shadow: var(--shadow2);
      backdrop-filter: blur(10px);
      transition: transform .14s ease, border-color .18s ease, box-shadow .18s ease;
    }
    .feed-item:hover{
      transform: translateY(-1px);
      border-color: rgba(125,249,255,.22);
      box-shadow: var(--shadow);
    }
    .feed-item time{
      display:block;
      font-size:.82rem;
      color:var(--muted);
      margin-top:4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    .friends-list{ display:flex; flex-direction:column; gap:8px; }
    .friend-row{
      display:flex;
      align-items:center;
      justify-content:space-between;

      border-radius: var(--r);
      padding: 9px 10px;
      border: 1px solid rgba(237,243,255,.12);
      background: rgba(8,10,20,.46);
      box-shadow: var(--shadow2);
      backdrop-filter: blur(10px);
      transition: transform .14s ease, border-color .18s ease, box-shadow .18s ease;
    }
    .friend-row:hover{
      transform: translateY(-1px);
      border-color: rgba(52,211,153,.18);
      box-shadow: var(--shadow);
    }
    .row-actions{ display:flex; gap:8px; }

    .pill{
      display:inline-block;
      border: 1px solid rgba(237,243,255,.12);
      border-radius: 999px;
      padding: 4px 10px;
      font-size:.82rem;
      color: var(--muted);
      background: rgba(8,10,20,.40);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    @media (max-width:520px){
      body{ padding:70px 12px 64px; }
      .profile-box{ padding:26px 16px; border-radius: 22px; }
      .profile-pic{ width:124px; height:124px; border-radius: 20px; }
      .back-btn{ top:12px; left:12px; padding:9px 12px; }
    }
  </style>

</head>
<body>
  <!-- 🔙 Back to Homepage -->
  <button class="back-btn" onclick="window.location.href='index.html'">← Back to Homepage</button>

  <div class="profile-box" role="region" aria-label="User profile">
    <img id="profile-pic" src="" alt="Your profile photo" class="profile-pic" />

    <h1 id="user-name">Loading…</h1>
    <div class="email" id="user-email">Loading…</div>

    <div class="badges" id="badges"></div>

    <div class="btn-group">
      <button class="btn secondary" onclick="window.location.href='profile-edit.html'">Edit Profile</button>
      <button class="btn secondary" onclick="alert('Report – coming soon')">Report Issue</button>
      <button class="btn" onclick="logoutUser()">Log Out</button>
    </div>

    <!-- New Post -->
<div class="section" id="newpost-section">
  <h2>Share something</h2>
  <textarea id="new-post-content" rows="3" placeholder="Write something..." style="width:100%;padding:10px;border-radius:10px;background:rgba(255,255,255,.05);color:#eaf2ff;border:1px solid var(--border);"></textarea>
  <div style="margin-top:10px;display:flex;justify-content:flex-end;gap:8px;">
    <select id="post-visibility" style="background:#121625;color:#eaf2ff;border:1px solid var(--border);border-radius:8px;padding:6px;">
      <option value="public">🌍 Public</option>
      <option value="friends">👥 Friends</option>
      <option value="private">🔒 Private</option>
    </select>
    <button class="btn" onclick="createPost()">Post</button>
  </div>
</div>

<!-- Activity Feed -->
<div class="section" id="activity-section">
  <h2>Activity</h2>
  <div id="activity-feed" class="feed" aria-live="polite">
    <div class="feed-item">Loading activity…</div>
  </div>
</div>

    <!-- Friends -->
    <div class="section" id="friends-section">
      <h2>My Friends <span class="pill" id="friends-count">0</span></h2>
      <div id="friends-list" class="friends-list">
        <div class="friend-row"><span>Loading…</span></div>
      </div>
    </div>

    <!-- Friend Requests -->
    <div class="section" id="requests-section">
      <h2>Friend Requests <span class="pill" id="requests-count">0</span></h2>
      <div id="requests-list" class="friends-list">
        <div class="friend-row"><span>No pending requests.</span></div>
      </div>
    </div>
  </div>

  <script>

    // Small helpers
    const clamp = (n, min, max) => Math.max(min, Math.min(max, n|0));

        document.addEventListener('DOMContentLoaded', async () => {
      // ✅ Stabilna sesja (spójnie z index.html)
      const { data: { session } } = await supabaseClient.auth.getSession();
      const user = session?.user || null;

      if (!user) {
        // bez alertów; zapamiętaj powrót
        try { localStorage.setItem('ba_redirect', 'profile.html'); } catch {}
        location.replace('index.html?login=1');
        return;
      }

      const meta = user.user_metadata || {};

     // Pobierz dane profilu z tabeli `profiles` (a jak nie ma — utwórz)
let profile = null;

try {
  const { data: existing, error: selErr } = await supabaseClient
    .from('profiles')
    .select('*')
    .eq('id', user.id)
    .maybeSingle();

  if (selErr) console.warn('profiles fetch error:', selErr.message);

  if (!existing) {
    const email = String(user.email || '');
    const base =
      (email.split('@')[0] || 'user')
        .replace(/[^a-zA-Z0-9_]/g, '')
        .toLowerCase() || 'user';

    let candidate = base;

    // 1) spróbuj wstawić
    let ins = await supabaseClient.from('profiles').insert({
      id: user.id,
      username: candidate,
      first_name: meta.first_name || null,
      last_name: meta.last_name || null
    });

    // 2) jeśli username zajęty (unique) — spróbuj raz jeszcze z sufiksem
    if (ins?.error) {
      candidate = `${base}${Math.floor(Date.now() % 10000)}`;
      ins = await supabaseClient.from('profiles').insert({
        id: user.id,
        username: candidate,
        first_name: meta.first_name || null,
        last_name: meta.last_name || null
      });
      if (ins?.error) console.warn('profiles insert error:', ins.error.message);
    }

    const { data: created } = await supabaseClient
      .from('profiles')
      .select('*')
      .eq('id', user.id)
      .maybeSingle();

    profile = created || null;
  } else {
    profile = existing;
  }

  // Avatar (cache-busting)
  const profilePic = document.getElementById("profile-pic");
  let url = profile?.avatar_url || meta.avatar_url;
  if (url) {
    if (!url.startsWith("https")) {
      url = `${SUPABASE_URL}/storage/v1/object/public${url.startsWith('/') ? '' : '/'}${url}`;
    }
    const bust = url.includes("?") ? "&" + Date.now() : "?" + Date.now();
    profilePic.src = url + bust;
  } else {
    profilePic.src = "images/avatar-default.png";
  }
} catch (e) {
  console.error('profiles query failed:', e);
}

// Fallback do user_metadata
const p = profile || {};

const fullName = [p.first_name || meta.first_name, p.last_name || meta.last_name]
  .filter(Boolean).join(" ");
document.getElementById("user-name").textContent = fullName || "BeAwarely User";

document.getElementById("user-email").textContent = "@" + (p.username || meta.username || "unknown");

const badgeContainer = document.getElementById("badges");
badgeContainer.innerHTML = "";
const badges = Array.isArray(p.badges) ? p.badges : (Array.isArray(meta.badges) ? meta.badges : []);
badges.forEach(text => {
  const div = document.createElement("div");
  div.className = "badge";
  div.textContent = text;
  badgeContainer.appendChild(div);
});
          
      // Jednorazowe bezpieczne domyślne metadane (opcjonalnie)
      if (meta.role == null || meta.points == null || meta.trust_score == null || meta.badges == null) {
        const updates = {
          data: {
            role: meta.role ?? "Specialist",
            points: meta.points ?? 320,
            trust_score: meta.trust_score ?? 87,
            badges: Array.isArray(meta.badges) ? meta.badges : [
              "Verified Expert",
              "100+ Posts",
              "15 AI-Verified Answers"
            ]
          }
        };
        const { error: updateError } = await supabaseClient.auth.updateUser(updates);
        if (updateError) {
          console.error("❌ Metadata update error:", updateError.message);
        } else {
          console.log("✅ Metadata filled with defaults.");
          location.reload();
        }
      }

            // === Load social data ===
            try {
        await loadMyPosts();
        await loadMyActivity();
        await loadFriends();
        await loadFriendRequests();
        // subscribeRealtimeFeed(); // disabled: we’re using user_posts now
      } catch(e) { console.warn('Social init error:', e); }

      // Reakcja na zmianę sesji w locie (np. wylogowanie w innej karcie)
      supabaseClient.auth.onAuthStateChange((_ev, newSession) => {

        if (!newSession) {
          location.replace('index.html');
        }
      });
    });

        async function logoutUser() {
      try {
        await supabaseClient.auth.signOut(); // jedna komenda – spójnie z index.html
      } catch (e) {
        console.warn('signOut failed:', e?.message || e);
      } finally {
        location.replace('index.html'); // czysty redirect
      }
    }

      // ===== Activity & Friends logic (Supabase) =====

    async function loadMyFeed(limit=20){
      const { data: { session } } = await supabaseClient.auth.getSession();
      const uid = session?.user?.id;
      if(!uid) return;

      // RLS w tabeli activity_events powinno przepuścić: własne, public, friends
      const { data, error } = await supabaseClient
        .from('activity_events')
        .select('id, actor_id, verb, subject_type, summary, created_at')
        .order('created_at', { ascending:false })
        .limit(limit);

      const feed = document.getElementById('activity-feed');
      feed.innerHTML = '';
      if(error){ feed.innerHTML = `<div class="feed-item">Feed unavailable.</div>`; return; }
      if(!data?.length){ feed.innerHTML = `<div class="feed-item">No activity yet.</div>`; return; }

      for(const ev of data){
        const div = document.createElement('div');
        div.className='feed-item';
        const text = ev.summary || `${ev.verb} · ${ev.subject_type}`;
        const t = new Date(ev.created_at).toLocaleString();
        div.innerHTML = `<div>${text}</div><time datetime="${ev.created_at}">${t}</time>`;
        feed.appendChild(div);
      }
    }

    async function loadFriends(){
      const { data: { session } } = await supabaseClient.auth.getSession();
      const uid = session?.user?.id;
      if(!uid) return;

      const { data, error } = await supabaseClient
        .from('friendships')
        .select('id, requester_id, addressee_id, status')
        .or(`requester_id.eq.${uid},addressee_id.eq.${uid}`)
        .eq('status','accepted');

      const list = document.getElementById('friends-list');
      const count = document.getElementById('friends-count');
      list.innerHTML = '';
      if(error){ list.innerHTML = `<div class="friend-row"><span>Friends unavailable.</span></div>`; count.textContent='0'; return; }
      if(!data?.length){ list.innerHTML = `<div class="friend-row"><span>No friends yet.</span></div>`; count.textContent='0'; return; }

      const rows = [];
      for(const f of data){
        const otherId = f.requester_id === uid ? f.addressee_id : f.requester_id;
        rows.push(otherId);
      }

      // próbujemy dograć display_name z profiles
      let names = {};
      if(rows.length){
        const { data: profs } = await supabaseClient
  .from('profiles')
  .select('id, first_name, last_name')
  .in('id', rows);
(profs||[]).forEach(p=>{
  const name = [p.first_name, p.last_name].filter(Boolean).join(' ') || 'User';
  names[p.id] = name;
});
      }

      rows.forEach(otherId=>{
        const row=document.createElement('div');
        row.className='friend-row';
        row.innerHTML=`<span>${names[otherId]||'User'}</span>
          <div class="row-actions">
            <button class="btn secondary" onclick="unfriend('${otherId}')">Unfriend</button>
          </div>`;
        list.appendChild(row);
      });
      count.textContent = String(rows.length);
    }

    async function loadFriendRequests(){
      const { data: { session } } = await supabaseClient.auth.getSession();
      const uid = session?.user?.id;
      if(!uid) return;

      const { data, error } = await supabaseClient
        .from('friendships')
        .select('id, requester_id')
        .eq('addressee_id', uid)
        .eq('status','pending');

      const list = document.getElementById('requests-list');
      const count = document.getElementById('requests-count');
      list.innerHTML = '';
      if(error){ list.innerHTML = `<div class="friend-row"><span>Requests unavailable.</span></div>`; count.textContent='0'; return; }
      if(!data?.length){ list.innerHTML = `<div class="friend-row"><span>No pending requests.</span></div>`; count.textContent='0'; return; }

      // nazwy nadawców
      const ids = data.map(r=>r.requester_id);
      let names = {};
      const { data: profs } = await supabaseClient
  .from('profiles')
  .select('id, first_name, last_name')
  .in('id', ids);
(profs||[]).forEach(p=>{
  const name = [p.first_name, p.last_name].filter(Boolean).join(' ') || 'User';
  names[p.id] = name;
});

      data.forEach(req=>{
        const row=document.createElement('div');
        row.className='friend-row';
        row.innerHTML=`<span>${names[req.requester_id]||'User'}</span>
          <div class="row-actions">
            <button class="btn" onclick="acceptRequest('${req.id}')">Accept</button>
            <button class="btn secondary" onclick="rejectRequest('${req.id}')">Reject</button>
          </div>`;
        list.appendChild(row);
      });
      count.textContent = String(data.length);
    }

    async function acceptRequest(requestId){
  const { error } = await supabaseClient
    .from('friendships')
    .update({ status: 'accepted' })
    .eq('id', requestId);
  if(error){ alert('Failed: '+error.message); return; }
  // natychmiastowe odświeżenie widoku
  await loadFriendRequests();
  await loadFriends();
}

async function rejectRequest(requestId){
  const { error } = await supabaseClient
    .from('friendships')
    .update({ status: 'rejected' })
    .eq('id', requestId);
  if(error){ alert('Failed: '+error.message); return; }
  // natychmiastowe odświeżenie widoku
  await loadFriendRequests();
}

    async function unfriend(otherUserId){
      const { data: { session } } = await supabaseClient.auth.getSession();
      const uid = session?.user?.id;
      if(!uid) return;

      // usuń rekord (dowolna strona może usunąć)
      const { error } = await supabaseClient
        .from('friendships')
        .delete()
        .or(`and(requester_id.eq.${uid},addressee_id.eq.${otherUserId}),and(requester_id.eq.${otherUserId},addressee_id.eq.${uid})`);
      if(error){ alert('Failed: '+error.message); return; }
      await loadFriends();
    }

        function subscribeRealtimeFeed(){
      try{
        supabaseClient
          .channel('realtime-activity')
          .on('postgres_changes',
            { event: 'INSERT', schema: 'public', table: 'activity_events' },
            async () => { await loadMyFeed(); }
          )
          .subscribe();
      }catch(e){ /* ok */ }
    }

    // 📝 Create user post
    async function createPost(){
      const { data: { session } } = await supabaseClient.auth.getSession();
      const user = session?.user;
      if(!user) return alert("Session expired, please log in again.");

      const content = document.getElementById('new-post-content').value.trim();
      const visibility = document.getElementById('post-visibility').value;

      if(!content){ alert("Post cannot be empty."); return; }

      const { error } = await supabaseClient.from('user_posts').insert({
        author_id: user.id,
        content,
        visibility
      });

      if(error){
        alert("❌ Failed to publish: " + error.message);
        return;
      }

      document.getElementById('new-post-content').value = "";
      alert("✅ Post published!");
      await loadMyPosts();
    }

    // 📥 Load posts
        async function loadMyPosts(){
      const { data: { session } } = await supabaseClient.auth.getSession();
      const user = session?.user;
      if(!user) return;

      const { data, error } = await supabaseClient
        .from('user_posts')
        .select('content, created_at, visibility')
        .eq('author_id', user.id)
        .order('created_at', { ascending: false });

      const feed = document.getElementById('activity-feed');
      feed.innerHTML = '';

      if(error){ 
        feed.innerHTML = `<div class="feed-item">Feed unavailable.</div>`;
        return;
      }
      if(!data.length){ 
        feed.innerHTML = `<div class="feed-item">No posts yet.</div>`;
        return;
      }

      data.forEach(p=>{
        const div=document.createElement('div');
        div.className='feed-item';
        div.innerHTML=`<div>${p.content}</div><time>${new Date(p.created_at).toLocaleString()}</time>`;
        feed.appendChild(div);
      });
    }

    // 🔹 Nowe: wyświetlanie aktywności z innych sekcji
    async function loadMyActivity() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      const uid = session?.user?.id;
      if (!uid) return;

      const { data, error } = await supabaseClient
        .from('activity_events')
        .select('summary, created_at')
        .eq('actor_id', uid)
        .order('created_at', { ascending: false })
        .limit(30);

      const feed = document.getElementById('activity-feed');
      if (error || !data?.length) return;

      data.forEach(ev => {
        const div = document.createElement('div');
        div.className = 'feed-item';
        div.innerHTML = `<div>${ev.summary}</div><time>${new Date(ev.created_at).toLocaleString()}</time>`;
        feed.appendChild(div);
      });
    }
  </script>
