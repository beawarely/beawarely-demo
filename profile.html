<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Your Profile – BeAwarely</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.44.4/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-client.js"></script>
    <style>
  :root{
    --safe-top: env(safe-area-inset-top, 0px);

    /* Neon-glass profile theme */
    --bg0:#050615;
    --bg1:#0a0d24;

    --text:#ecf3ff;
    --muted:rgba(236,243,255,.72);

    --accent:#7c5cff;   /* violet */
    --accent2:#37d6ff;  /* cyan */
    --accent3:#54ffa3;  /* mint */

    --panel:rgba(12,14,28,.62);
    --card:rgba(10,12,24,.55);
    --border:rgba(236,243,255,.14);
    --ring:rgba(55,214,255,.34);

    --shadow:0 24px 80px rgba(0,0,0,.55);
    --shadow2:0 12px 28px rgba(0,0,0,.28);

    --r:18px;
    --r2:24px;
  }

  *{ box-sizing:border-box; }
  html, body{ height:100%; }

  body{
    margin:0;
    padding:calc(56px + var(--safe-top)) 16px 80px;
    min-height:100vh;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color:var(--text);
    text-align:center;

    background:
      radial-gradient(900px 520px at 18% 10%, color-mix(in oklab, var(--accent2) 28%, transparent), transparent 60%),
      radial-gradient(820px 520px at 90% 18%, color-mix(in oklab, var(--accent) 26%, transparent), transparent 62%),
      radial-gradient(900px 620px at 50% 120%, color-mix(in oklab, var(--accent3) 18%, transparent), transparent 60%),
      linear-gradient(180deg, var(--bg0), var(--bg1));
    background-attachment:fixed;
    overflow-x:hidden;
  }

  /* subtle grid haze */
  body::before{
    content:"";
    position:fixed; inset:0;
    pointer-events:none;
    opacity:.18;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,.08) 0 1px, transparent 1px 28px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.06) 0 1px, transparent 1px 32px);
    mix-blend-mode:overlay;
  }

  /* slow aurora sheet */
  body::after{
    content:"";
    position:fixed; inset:-20%;
    pointer-events:none;
    opacity:.34;
    filter: blur(18px) saturate(135%);
    background:
      conic-gradient(from 210deg at 40% 40%,
        transparent 0 18%,
        color-mix(in oklab, var(--accent2) 55%, transparent) 18% 30%,
        transparent 30% 52%,
        color-mix(in oklab, var(--accent) 55%, transparent) 52% 64%,
        transparent 64% 78%,
        color-mix(in oklab, var(--accent3) 45%, transparent) 78% 92%,
        transparent 92% 100%);
    animation: profileAurora 18s ease-in-out infinite alternate;
    transform: rotate(6deg);
  }

  @keyframes profileAurora{
    0%{ transform: translate3d(-2%, -2%, 0) rotate(4deg) scale(1.02); }
    100%{ transform: translate3d(2%, 1%, 0) rotate(10deg) scale(1.05); }
  }

  @media (prefers-reduced-motion: reduce){
    body::after{ animation:none; }
    .btn, .profile-pic, .feed-item, .friend-row, .back-btn{ transition:none !important; }
  }

  .back-btn{
    position:fixed; top:14px; left:14px; z-index:10;
    appearance:none;
    padding:10px 14px;
    border-radius:999px;
    border:1px solid transparent;
    cursor:pointer;
    color:var(--text);
    background:
      linear-gradient(var(--panel), var(--panel)) padding-box,
      linear-gradient(135deg,
        color-mix(in oklab, var(--accent2) 45%, transparent),
        color-mix(in oklab, var(--accent) 45%, transparent),
        color-mix(in oklab, var(--accent3) 35%, transparent)
      ) border-box;
    backdrop-filter: blur(12px);
    box-shadow: var(--shadow2);
    transition: transform .14s ease, box-shadow .18s ease, filter .18s ease;
  }
  .back-btn:hover{ transform: translateY(-1px); filter:saturate(1.1); box-shadow: var(--shadow); }
  .back-btn:focus-visible{ outline:2px solid var(--ring); outline-offset:2px; }

  .profile-box{
    position:relative;
    max-width:820px;
    margin:68px auto 0;
    text-align:center;

    padding:34px 26px;
    border-radius:var(--r2);
    border:1px solid transparent;
    background:
      linear-gradient(var(--panel), var(--panel)) padding-box,
      linear-gradient(135deg,
        color-mix(in oklab, var(--accent2) 40%, transparent),
        color-mix(in oklab, var(--accent) 40%, transparent),
        color-mix(in oklab, var(--accent3) 30%, transparent)
      ) border-box;

    box-shadow: var(--shadow);
    backdrop-filter: blur(14px);
    overflow:hidden;
  }

  .profile-box::after{
    content:"";
    position:absolute; inset:-1px;
    pointer-events:none;
    opacity:.55;
    background:
      radial-gradient(700px 220px at 22% 10%, color-mix(in oklab, var(--accent2) 22%, transparent), transparent 60%),
      radial-gradient(620px 220px at 84% 18%, color-mix(in oklab, var(--accent) 18%, transparent), transparent 62%);
  }

  .profile-pic{
    width:136px; height:136px;
    border-radius:50%;
    object-fit:cover;
    margin-bottom:12px;
    display:inline-block;

    border:2px solid rgba(255,255,255,.10);
    box-shadow:
      0 16px 44px rgba(0,0,0,.55),
      0 0 0 6px color-mix(in oklab, var(--accent2) 18%, transparent),
      0 0 0 10px color-mix(in oklab, var(--accent) 10%, transparent);
    transition: transform .18s ease, box-shadow .22s ease, filter .22s ease;
    filter:saturate(1.05) contrast(1.02);
  }
  .profile-pic:hover{
    transform: translateY(-2px);
    box-shadow:
      0 20px 60px rgba(0,0,0,.62),
      0 0 0 7px color-mix(in oklab, var(--accent2) 22%, transparent),
      0 0 0 12px color-mix(in oklab, var(--accent3) 12%, transparent);
  }

  h1{
    font-size: clamp(1.9rem, 2.6vw, 2.25rem);
    margin:10px 0 4px;
    letter-spacing:.2px;
    position:relative;
    z-index:1;
    background: linear-gradient(90deg, var(--accent2), var(--accent), var(--accent3));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow: 0 10px 35px color-mix(in oklab, var(--accent2) 14%, transparent);
  }

  .email{
    font-size:.98rem;
    color:var(--muted);
    margin-bottom:18px;
    word-break:break-word;
    position:relative;
    z-index:1;
  }

  .stats{
    display:grid;
    grid-template-columns:repeat(3, minmax(160px, 1fr));
    gap:14px;
    margin:10px 0 20px;
    font-size:.95rem;
    position:relative;
    z-index:1;
  }
  @media (max-width:720px){ .stats{ grid-template-columns:1fr 1fr; } }
  @media (max-width:440px){ .stats{ grid-template-columns:1fr; } }

  .stat{
    border-radius:var(--r);
    padding:12px 10px;
    border:1px solid color-mix(in oklab, var(--border) 95%, transparent);
    background: color-mix(in oklab, var(--card) 90%, transparent);
    box-shadow: var(--shadow2);
    backdrop-filter: blur(10px);
    position:relative;
    overflow:hidden;
  }
  .stat::after{
    content:"";
    position:absolute; inset:-40% -30%;
    pointer-events:none;
    opacity:.45;
    background: radial-gradient(circle at 30% 30%, color-mix(in oklab, var(--accent2) 18%, transparent), transparent 58%);
    transform: rotate(10deg);
  }
  .stat strong{ display:block; font-size:1.22rem; margin-top:6px; }

  .trust-bar{
    background: color-mix(in oklab, var(--card) 92%, transparent);
    border-radius:999px;
    height:10px;
    width:86%;
    margin:6px auto 8px;
    overflow:hidden;
    border:1px solid color-mix(in oklab, var(--border) 92%, transparent);
    box-shadow: inset 0 1px 2px rgba(0,0,0,.35);
    position:relative;
    z-index:1;
  }
  .trust-fill{
    background: linear-gradient(90deg, var(--accent3), #10b981);
    height:100%;
    width:0%;
    border-radius:999px;
    transition: width .35s ease;
  }

  .badges{
    margin:14px 0 22px;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    position:relative;
    z-index:1;
  }
  .badge{
    border-radius:999px;
    padding:6px 12px;
    font-size:.85rem;
    white-space:nowrap;
    color: color-mix(in oklab, var(--text) 92%, transparent);
    border:1px solid color-mix(in oklab, var(--border) 95%, transparent);
    background: color-mix(in oklab, var(--card) 86%, transparent);
    box-shadow: 0 10px 22px rgba(0,0,0,.22);
    backdrop-filter: blur(10px);
  }

  .btn-group{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
    position:relative;
    z-index:1;
  }

  .btn{
    appearance:none;
    border:1px solid transparent;
    border-radius:14px;
    min-width:140px;
    padding:11px 18px;
    cursor:pointer;
    font-size:.95rem;
    font-weight:700;
    letter-spacing:.2px;
    color:#071020;

    background:
      linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,0)) padding-box,
      linear-gradient(135deg, var(--accent2), var(--accent)) border-box;
    box-shadow: 0 14px 30px color-mix(in oklab, var(--accent2) 12%, rgba(0,0,0,.55));
    transition: transform .12s ease, box-shadow .18s ease, filter .18s ease;
  }
  .btn:hover{ transform: translateY(-1px); filter:saturate(1.06); box-shadow: 0 18px 44px rgba(0,0,0,.45); }
  .btn:active{ transform: translateY(0px) scale(.99); }
  .btn:focus-visible{ outline:2px solid var(--ring); outline-offset:2px; }

  .btn.secondary{
    color:var(--text);
    border-color: color-mix(in oklab, var(--border) 95%, transparent);
    background: color-mix(in oklab, var(--card) 86%, transparent);
    box-shadow: var(--shadow2);
  }
  .btn.secondary:hover{ filter:brightness(1.04); }

  /* override inline styles in New Post */
  #new-post-content{
    width:100% !important;
    padding:12px 14px !important;
    border-radius:16px !important;
    border:1px solid color-mix(in oklab, var(--border) 95%, transparent) !important;
    background: color-mix(in oklab, var(--card) 88%, transparent) !important;
    color:var(--text) !important;
    outline:none !important;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.04) !important;
  }
  #new-post-content:focus{
    border-color: color-mix(in oklab, var(--accent2) 55%, var(--border)) !important;
    box-shadow: 0 0 0 3px var(--ring), inset 0 0 0 1px rgba(255,255,255,.05) !important;
  }

  #post-visibility{
    background: color-mix(in oklab, var(--card) 92%, transparent) !important;
    color:var(--text) !important;
    border:1px solid color-mix(in oklab, var(--border) 95%, transparent) !important;
    border-radius:999px !important;
    padding:8px 12px !important;
    backdrop-filter: blur(10px) !important;
    box-shadow: var(--shadow2) !important;
  }

  .upload-wrap{ margin-top:26px; padding-top:18px; border-top:1px dashed color-mix(in oklab, var(--border) 92%, transparent); position:relative; z-index:1; }
  .helper{ font-size:.9rem; color:var(--muted); margin-top:8px; position:relative; z-index:1; }
  .sr{ position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden; }

  /* Sections (Activity/Friends) */
  .section{
    margin-top:26px;
    padding-top:18px;
    border-top:1px dashed color-mix(in oklab, var(--border) 92%, transparent);
    text-align:left;
    position:relative;
    z-index:1;
  }
  .section h2{
    font-size:1.08rem;
    margin:0 0 12px;
    display:flex;
    align-items:center;
    gap:10px;
    letter-spacing:.2px;
    color: color-mix(in oklab, var(--text) 92%, transparent);
  }

  .feed{ display:flex; flex-direction:column; gap:10px; }
  .feed-item{
    border-radius:var(--r);
    padding:10px 12px;
    border:1px solid color-mix(in oklab, var(--border) 95%, transparent);
    background: color-mix(in oklab, var(--card) 88%, transparent);
    box-shadow: var(--shadow2);
    backdrop-filter: blur(10px);
    transition: transform .14s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .feed-item:hover{
    transform: translateY(-1px);
    border-color: color-mix(in oklab, var(--accent2) 22%, var(--border));
    box-shadow: var(--shadow);
  }
  .feed-item time{ display:block; font-size:.82rem; color:var(--muted); margin-top:4px; }

  .friends-list{ display:flex; flex-direction:column; gap:8px; }
  .friend-row{
    display:flex;
    align-items:center;
    justify-content:space-between;

    border-radius:var(--r);
    padding:9px 10px;
    border:1px solid color-mix(in oklab, var(--border) 95%, transparent);
    background: color-mix(in oklab, var(--card) 88%, transparent);
    box-shadow: var(--shadow2);
    backdrop-filter: blur(10px);
    transition: transform .14s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .friend-row:hover{
    transform: translateY(-1px);
    border-color: color-mix(in oklab, var(--accent) 18%, var(--border));
    box-shadow: var(--shadow);
  }

  .row-actions{ display:flex; gap:8px; }

  .pill{
    display:inline-block;
    border:1px solid color-mix(in oklab, var(--border) 95%, transparent);
    border-radius:999px;
    padding:4px 10px;
    font-size:.82rem;
    color:var(--muted);
    background: color-mix(in oklab, var(--card) 86%, transparent);
  }

  @media (max-width:520px){
    body{ padding:calc(70px + var(--safe-top)) 12px 64px; }
    .profile-box{ padding:26px 16px; border-radius:20px; }
    .profile-pic{ width:122px; height:122px; }
    .back-btn{ top:12px; left:12px; padding:9px 12px; }
  }
</style>

</head>
<body>
  <!-- 🔙 Back to Homepage -->
  <button class="back-btn" onclick="window.location.href='index.html'">← Back to Homepage</button>

  <div class="profile-box" role="region" aria-label="User profile">
    <img id="profile-pic" src="" alt="Your profile photo" class="profile-pic" />

    <h1 id="user-name">Loading…</h1>
    <div class="email" id="user-email">Loading…</div>

    <div class="badges" id="badges"></div>

    <div class="btn-group">
      <button class="btn secondary" onclick="window.location.href='profile-edit.html'">Edit Profile</button>
      <button class="btn secondary" onclick="alert('Report – coming soon')">Report Issue</button>
      <button class="btn" onclick="logoutUser()">Log Out</button>
    </div>

    <!-- New Post -->
<div class="section" id="newpost-section">
  <h2>Share something</h2>
  <textarea id="new-post-content" rows="3" placeholder="Write something..." style="width:100%;padding:10px;border-radius:10px;background:rgba(255,255,255,.05);color:#eaf2ff;border:1px solid var(--border);"></textarea>
  <div style="margin-top:10px;display:flex;justify-content:flex-end;gap:8px;">
    <select id="post-visibility" style="background:#121625;color:#eaf2ff;border:1px solid var(--border);border-radius:8px;padding:6px;">
      <option value="public">🌍 Public</option>
      <option value="friends">👥 Friends</option>
      <option value="private">🔒 Private</option>
    </select>
    <button class="btn" onclick="createPost()">Post</button>
  </div>
</div>

<!-- Activity Feed -->
<div class="section" id="activity-section">
  <h2>Activity</h2>
  <div id="activity-feed" class="feed" aria-live="polite">
    <div class="feed-item">Loading activity…</div>
  </div>
</div>

    <!-- Friends -->
    <div class="section" id="friends-section">
      <h2>My Friends <span class="pill" id="friends-count">0</span></h2>
      <div id="friends-list" class="friends-list">
        <div class="friend-row"><span>Loading…</span></div>
      </div>
    </div>

    <!-- Friend Requests -->
    <div class="section" id="requests-section">
      <h2>Friend Requests <span class="pill" id="requests-count">0</span></h2>
      <div id="requests-list" class="friends-list">
        <div class="friend-row"><span>No pending requests.</span></div>
      </div>
    </div>
  </div>

  <script>

    // Small helpers
    const clamp = (n, min, max) => Math.max(min, Math.min(max, n|0));

        document.addEventListener('DOMContentLoaded', async () => {
      // ✅ Stabilna sesja (spójnie z index.html)
      const { data: { session } } = await supabaseClient.auth.getSession();
      const user = session?.user || null;

      if (!user) {
        // bez alertów; zapamiętaj powrót
        try { localStorage.setItem('ba_redirect', 'profile.html'); } catch {}
        location.replace('index.html?login=1');
        return;
      }

      const meta = user.user_metadata || {};

     // Pobierz dane profilu z tabeli `profiles`
let profile = null;
try {
  const { data, error } = await supabaseClient
    .from('profiles')
    .select('*')
    .eq('id', user.id)
    .single();

  if (error) {
    console.warn('profiles fetch error:', error.message);
  } else {
    profile = data;

    // Avatar (cache-busting)
    const profilePic = document.getElementById("profile-pic");
    let url = profile?.avatar_url || meta.avatar_url;
    if (url) {
  if (!url.startsWith("https")) {
    url = `${SUPABASE_URL}/storage/v1/object/public${url.startsWith('/') ? '' : '/'}${url}`;
  }
  const bust = url.includes("?") ? "&" + Date.now() : "?" + Date.now();
  profilePic.src = url + bust;
} else {
  profilePic.src = "images/avatar-default.png";
}
  }
} catch(e) {
  console.error('profiles query failed:', e);
}

// Fallback do user_metadata
const p = profile || {};

const fullName = [p.first_name || meta.first_name, p.last_name || meta.last_name]
  .filter(Boolean).join(" ");
document.getElementById("user-name").textContent = fullName || "BeAwarely User";

document.getElementById("user-email").textContent = "@" + (p.username || meta.username || "unknown");

const badgeContainer = document.getElementById("badges");
badgeContainer.innerHTML = "";
const badges = Array.isArray(p.badges) ? p.badges : (Array.isArray(meta.badges) ? meta.badges : []);
badges.forEach(text => {
  const div = document.createElement("div");
  div.className = "badge";
  div.textContent = text;
  badgeContainer.appendChild(div);
});
          
      // Jednorazowe bezpieczne domyślne metadane (opcjonalnie)
      if (meta.role == null || meta.points == null || meta.trust_score == null || meta.badges == null) {
        const updates = {
          data: {
            role: meta.role ?? "Specialist",
            points: meta.points ?? 320,
            trust_score: meta.trust_score ?? 87,
            badges: Array.isArray(meta.badges) ? meta.badges : [
              "Verified Expert",
              "100+ Posts",
              "15 AI-Verified Answers"
            ]
          }
        };
        const { error: updateError } = await supabaseClient.auth.updateUser(updates);
        if (updateError) {
          console.error("❌ Metadata update error:", updateError.message);
        } else {
          console.log("✅ Metadata filled with defaults.");
          location.reload();
        }
      }

            // === Load social data ===
            try {
        await loadMyPosts();
        await loadMyActivity();
        await loadFriends();
        await loadFriendRequests();
        // subscribeRealtimeFeed(); // disabled: we’re using user_posts now
      } catch(e) { console.warn('Social init error:', e); }

      // Reakcja na zmianę sesji w locie (np. wylogowanie w innej karcie)
      supabaseClient.auth.onAuthStateChange((_ev, newSession) => {

        if (!newSession) {
          location.replace('index.html');
        }
      });
    });

        async function logoutUser() {
      try {
        await supabaseClient.auth.signOut(); // jedna komenda – spójnie z index.html
      } catch (e) {
        console.warn('signOut failed:', e?.message || e);
      } finally {
        location.replace('index.html'); // czysty redirect
      }
    }

      // ===== Activity & Friends logic (Supabase) =====

    async function loadMyFeed(limit=20){
      const { data: { session } } = await supabaseClient.auth.getSession();
      const uid = session?.user?.id;
      if(!uid) return;

      // RLS w tabeli activity_events powinno przepuścić: własne, public, friends
      const { data, error } = await supabaseClient
        .from('activity_events')
        .select('id, actor_id, verb, subject_type, summary, created_at')
        .order('created_at', { ascending:false })
        .limit(limit);

      const feed = document.getElementById('activity-feed');
      feed.innerHTML = '';
      if(error){ feed.innerHTML = `<div class="feed-item">Feed unavailable.</div>`; return; }
      if(!data?.length){ feed.innerHTML = `<div class="feed-item">No activity yet.</div>`; return; }

      for(const ev of data){
        const div = document.createElement('div');
        div.className='feed-item';
        const text = ev.summary || `${ev.verb} · ${ev.subject_type}`;
        const t = new Date(ev.created_at).toLocaleString();
        div.innerHTML = `<div>${text}</div><time datetime="${ev.created_at}">${t}</time>`;
        feed.appendChild(div);
      }
    }

    async function loadFriends(){
      const { data: { session } } = await supabaseClient.auth.getSession();
      const uid = session?.user?.id;
      if(!uid) return;

      const { data, error } = await supabaseClient
        .from('friendships')
        .select('id, requester_id, addressee_id, status')
        .or(`requester_id.eq.${uid},addressee_id.eq.${uid}`)
        .eq('status','accepted');

      const list = document.getElementById('friends-list');
      const count = document.getElementById('friends-count');
      list.innerHTML = '';
      if(error){ list.innerHTML = `<div class="friend-row"><span>Friends unavailable.</span></div>`; count.textContent='0'; return; }
      if(!data?.length){ list.innerHTML = `<div class="friend-row"><span>No friends yet.</span></div>`; count.textContent='0'; return; }

      const rows = [];
      for(const f of data){
        const otherId = f.requester_id === uid ? f.addressee_id : f.requester_id;
        rows.push(otherId);
      }

      // próbujemy dograć display_name z profiles
      let names = {};
      if(rows.length){
        const { data: profs } = await supabaseClient
  .from('profiles')
  .select('id, first_name, last_name')
  .in('id', rows);
(profs||[]).forEach(p=>{
  const name = [p.first_name, p.last_name].filter(Boolean).join(' ') || 'User';
  names[p.id] = name;
});
      }

      rows.forEach(otherId=>{
        const row=document.createElement('div');
        row.className='friend-row';
        row.innerHTML=`<span>${names[otherId]||'User'}</span>
          <div class="row-actions">
            <button class="btn secondary" onclick="unfriend('${otherId}')">Unfriend</button>
          </div>`;
        list.appendChild(row);
      });
      count.textContent = String(rows.length);
    }

    async function loadFriendRequests(){
      const { data: { session } } = await supabaseClient.auth.getSession();
      const uid = session?.user?.id;
      if(!uid) return;

      const { data, error } = await supabaseClient
        .from('friendships')
        .select('id, requester_id')
        .eq('addressee_id', uid)
        .eq('status','pending');

      const list = document.getElementById('requests-list');
      const count = document.getElementById('requests-count');
      list.innerHTML = '';
      if(error){ list.innerHTML = `<div class="friend-row"><span>Requests unavailable.</span></div>`; count.textContent='0'; return; }
      if(!data?.length){ list.innerHTML = `<div class="friend-row"><span>No pending requests.</span></div>`; count.textContent='0'; return; }

      // nazwy nadawców
      const ids = data.map(r=>r.requester_id);
      let names = {};
      const { data: profs } = await supabaseClient
  .from('profiles')
  .select('id, first_name, last_name')
  .in('id', ids);
(profs||[]).forEach(p=>{
  const name = [p.first_name, p.last_name].filter(Boolean).join(' ') || 'User';
  names[p.id] = name;
});

      data.forEach(req=>{
        const row=document.createElement('div');
        row.className='friend-row';
        row.innerHTML=`<span>${names[req.requester_id]||'User'}</span>
          <div class="row-actions">
            <button class="btn" onclick="acceptRequest('${req.id}')">Accept</button>
            <button class="btn secondary" onclick="rejectRequest('${req.id}')">Reject</button>
          </div>`;
        list.appendChild(row);
      });
      count.textContent = String(data.length);
    }

    async function acceptRequest(requestId){
  const { error } = await supabaseClient
    .from('friendships')
    .update({ status: 'accepted' })
    .eq('id', requestId);
  if(error){ alert('Failed: '+error.message); return; }
  // natychmiastowe odświeżenie widoku
  await loadFriendRequests();
  await loadFriends();
}

async function rejectRequest(requestId){
  const { error } = await supabaseClient
    .from('friendships')
    .update({ status: 'rejected' })
    .eq('id', requestId);
  if(error){ alert('Failed: '+error.message); return; }
  // natychmiastowe odświeżenie widoku
  await loadFriendRequests();
}

    async function unfriend(otherUserId){
      const { data: { session } } = await supabaseClient.auth.getSession();
      const uid = session?.user?.id;
      if(!uid) return;

      // usuń rekord (dowolna strona może usunąć)
      const { error } = await supabaseClient
        .from('friendships')
        .delete()
        .or(`and(requester_id.eq.${uid},addressee_id.eq.${otherUserId}),and(requester_id.eq.${otherUserId},addressee_id.eq.${uid})`);
      if(error){ alert('Failed: '+error.message); return; }
      await loadFriends();
    }

        function subscribeRealtimeFeed(){
      try{
        supabaseClient
          .channel('realtime-activity')
          .on('postgres_changes',
            { event: 'INSERT', schema: 'public', table: 'activity_events' },
            async () => { await loadMyFeed(); }
          )
          .subscribe();
      }catch(e){ /* ok */ }
    }

    // 📝 Create user post
    async function createPost(){
      const { data: { session } } = await supabaseClient.auth.getSession();
      const user = session?.user;
      if(!user) return alert("Session expired, please log in again.");

      const content = document.getElementById('new-post-content').value.trim();
      const visibility = document.getElementById('post-visibility').value;

      if(!content){ alert("Post cannot be empty."); return; }

      const { error } = await supabaseClient.from('user_posts').insert({
        author_id: user.id,
        content,
        visibility
      });

      if(error){
        alert("❌ Failed to publish: " + error.message);
        return;
      }

      document.getElementById('new-post-content').value = "";
      alert("✅ Post published!");
      await loadMyPosts();
    }

    // 📥 Load posts
        async function loadMyPosts(){
      const { data: { session } } = await supabaseClient.auth.getSession();
      const user = session?.user;
      if(!user) return;

      const { data, error } = await supabaseClient
        .from('user_posts')
        .select('content, created_at, visibility')
        .eq('author_id', user.id)
        .order('created_at', { ascending: false });

      const feed = document.getElementById('activity-feed');
      feed.innerHTML = '';

      if(error){ 
        feed.innerHTML = `<div class="feed-item">Feed unavailable.</div>`;
        return;
      }
      if(!data.length){ 
        feed.innerHTML = `<div class="feed-item">No posts yet.</div>`;
        return;
      }

      data.forEach(p=>{
        const div=document.createElement('div');
        div.className='feed-item';
        div.innerHTML=`<div>${p.content}</div><time>${new Date(p.created_at).toLocaleString()}</time>`;
        feed.appendChild(div);
      });
    }

    // 🔹 Nowe: wyświetlanie aktywności z innych sekcji
    async function loadMyActivity() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      const uid = session?.user?.id;
      if (!uid) return;

      const { data, error } = await supabaseClient
        .from('activity_events')
        .select('summary, created_at')
        .eq('actor_id', uid)
        .order('created_at', { ascending: false })
        .limit(30);

      const feed = document.getElementById('activity-feed');
      if (error || !data?.length) return;

      data.forEach(ev => {
        const div = document.createElement('div');
        div.className = 'feed-item';
        div.innerHTML = `<div>${ev.summary}</div><time>${new Date(ev.created_at).toLocaleString()}</time>`;
        feed.appendChild(div);
      });
    }
  </script>
</body>
