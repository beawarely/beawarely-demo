<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BeAwarely — Auth Callback</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.44.4/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-client.js"></script>

  <style>
    body{ margin:0; min-height:100vh; display:grid; place-items:center; background:#0b1220; color:#eaf2ff; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    .box{ max-width:520px; padding:20px; border:1px solid rgba(255,255,255,.12); border-radius:14px; background:rgba(16,26,51,.72); }
    .muted{ opacity:.75; font-size:14px; margin-top:8px; }
  </style>
</head>
<body>
  <div class="box">
    <div>Finalizing login…</div>
    <div class="muted">If nothing happens, go back and try again.</div>
  </div>

  <script>
    (async () => {
      try {
        const supabase = window.supabaseClient;
        if (!supabase) throw new Error("Supabase client not initialized");

        const { error } = await supabase.auth.exchangeCodeForSession(window.location.href);
        if (error) throw error;

        window.location.replace("/index.html");
      } catch (e) {
        console.error("[auth-callback] failed:", e);
      }
    })();
  </script>
</body>
</html>
