<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Auth Callback</title>
  <link rel="icon" href="data:," />
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b1220;color:#eaf2ff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;}
    .box{max-width:520px;padding:18px 16px;border:1px solid rgba(255,255,255,.12);border-radius:14px;background:rgba(16,26,51,.75)}
    .muted{opacity:.75;font-size:14px;margin-top:8px}
  </style>
</head>
<body>
  <div class="box">
    <div>Finishing login…</div>
    <div class="muted">If this takes too long, go back and try again.</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.44.4/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-client.js"></script>

  <script>
    (async () => {
      const supabase = window.supabaseClient;

      if (!supabase) {
                (window.baToast ? window.baToast("Supabase client not loaded.", "error") : alert("Supabase client not loaded."));
        return;
      }

      const url = new URL(window.location.href);
      const code = url.searchParams.get("code");

      if (!code) {
        // Nie ma code → wróć na start
        window.location.replace("/index.html");
        return;
      }

      const { error } = await supabase.auth.exchangeCodeForSession(code);

      if (error) {
        console.error("exchangeCodeForSession error:", error);
                (window.baToast ? window.baToast("❌ Login failed: " + error.message, "error") : alert("Login failed: " + error.message));
        return;
      }

      // Sukces → wróć na start (już zalogowany)
      window.location.replace("/index.html");
    })();
  </script>
</body>
</html>
