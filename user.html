<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profil użytkownika – BeAwarely</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.44.4/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-client.js"></script>

    <style>
  :root{
    --bg0:#05070d;
    --bg1:#0a1430;
    --bg2:#060912;

    --text:#eaf2ff;
    --muted:#a7b4d9;

    --glass: rgba(14,18,30,.72);
    --card: rgba(18,22,35,.78);
    --border: rgba(160,190,255,.16);

    --a1:#3af2d9;   /* mint neon */
    --a2:#7b5cff;   /* violet */
    --a3:#3f86ff;   /* blue */
    --shadow: 0 14px 40px rgba(0,0,0,.52);
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    padding:64px 16px 100px;
    min-height:100vh;
    color:var(--text);
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;

    background:
      radial-gradient(900px 520px at 12% -8%, rgba(63,134,255,.22), transparent 62%),
      radial-gradient(860px 560px at 108% 8%, rgba(58,242,217,.12), transparent 58%),
      radial-gradient(780px 520px at 50% 110%, rgba(123,92,255,.14), transparent 62%),
      linear-gradient(180deg, var(--bg1), var(--bg2));
    overflow-x:hidden;
  }

  /* aurora drift */
  body::before{
    content:"";
    position:fixed;
    inset:-18%;
    background:
      conic-gradient(from 190deg at 50% 50%,
        rgba(63,134,255,.10),
        rgba(58,242,217,.10),
        rgba(123,92,255,.10),
        rgba(63,134,255,.10));
    filter: blur(90px) saturate(1.35);
    opacity:.55;
    animation: aurora 18s ease-in-out infinite alternate;
    pointer-events:none;
    z-index:-2;
  }

  /* subtle grain */
  body::after{
    content:"";
    position:fixed;
    inset:0;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0, rgba(255,255,255,.05) 1px, transparent 1px, transparent 3px),
      repeating-linear-gradient(90deg, rgba(0,0,0,.22) 0, rgba(0,0,0,.22) 1px, transparent 1px, transparent 4px);
    opacity:.05;
    mix-blend-mode: overlay;
    pointer-events:none;
    z-index:-1;
  }

  @keyframes aurora{
    0%   { transform: translate3d(-2%, -1%, 0) rotate(-8deg) scale(1.02); }
    100% { transform: translate3d(2%,  1%, 0) rotate(10deg)  scale(1.05); }
  }

  .back-btn{
    position:fixed;
    top:14px;
    left:14px;
    z-index:10;

    border:1px solid rgba(255,255,255,.14);
    border-radius:14px;
    padding:10px 14px;
    font-size:.95rem;
    color:var(--text);
    cursor:pointer;

    background: linear-gradient(180deg, rgba(18,22,35,.78), rgba(10,12,22,.62));
    backdrop-filter: blur(8px);
    box-shadow: 0 10px 28px rgba(0,0,0,.35);
    transition: transform .14s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .back-btn:hover{
    transform: translateY(-1px);
    box-shadow: 0 14px 34px rgba(0,0,0,.42);
    border-color: rgba(58,242,217,.22);
  }

  .profile-box{
    width:100%;
    max-width:760px;
    margin-top:80px;
    text-align:center;

    position:relative;
    border-radius:22px;
    padding:42px 28px 36px;

    background: linear-gradient(180deg, rgba(14,18,30,.78), rgba(10,12,22,.60));
    box-shadow: var(--shadow);
    backdrop-filter: blur(10px);
    border:1px solid rgba(255,255,255,.10);
    overflow:hidden;
  }

  /* crystal border */
  .profile-box::before{
    content:"";
    position:absolute;
    inset:-1px;
    border-radius:22px;
    padding:1px;
    background: linear-gradient(135deg, rgba(58,242,217,.55), rgba(123,92,255,.40), rgba(63,134,255,.55));
    -webkit-mask:
      linear-gradient(#000 0 0) content-box,
      linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events:none;
    opacity:.55;
  }

  /* soft corner glow */
  .profile-box::after{
    content:"";
    position:absolute;
    inset:0;
    background:
      radial-gradient(420px 260px at 18% 18%, rgba(58,242,217,.10), transparent 62%),
      radial-gradient(460px 280px at 86% 22%, rgba(123,92,255,.10), transparent 64%);
    pointer-events:none;
    opacity:.9;
  }

  .profile-pic{
    width:136px;
    height:136px;
    border-radius:50%;
    object-fit:cover;
    margin-bottom:12px;
    display:inline-block;

    position:relative;
    border:2px solid rgba(255,255,255,.10);
    box-shadow: 0 14px 36px rgba(0,0,0,.55);
    transition: transform .18s ease, box-shadow .22s ease;
  }
  .profile-pic:hover{
    transform: translateY(-2px) scale(1.01);
    box-shadow: 0 18px 44px rgba(0,0,0,.62);
  }

  h2{
    font-size:2.05rem;
    margin:10px 0 4px;
    letter-spacing:.2px;
  }

  .username{
    display:inline-block;
    font-size:.95rem;
    margin-bottom:18px;
    color:var(--muted);

    padding:6px 10px;
    border-radius:999px;
    background: rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.10);
  }

  .friend-btn{
    appearance:none;
    border:1px solid rgba(255,255,255,.14);
    border-radius:14px;
    min-width:170px;
    padding:11px 18px;
    cursor:pointer;
    font-size:.95rem;
    color:#071018;

    background:
      linear-gradient(135deg, rgba(58,242,217,.95), rgba(63,134,255,.92), rgba(123,92,255,.92));
    box-shadow: 0 14px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.22);
    transition: transform .12s ease, box-shadow .18s ease, filter .18s ease;
  }
  .friend-btn:hover{
    transform: translateY(-1px);
    filter: saturate(1.05) contrast(1.02);
    box-shadow: 0 18px 38px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.24);
  }
  .friend-btn:disabled{
    opacity:.65;
    cursor:default;
    filter: grayscale(.25);
    transform:none;
  }

  .posts{
    margin-top:28px;
    display:flex;
    flex-direction:column;
    gap:12px;
    text-align:left;
  }

  .post{
    background: linear-gradient(180deg, rgba(18,22,35,.76), rgba(12,14,26,.66));
    border:1px solid rgba(255,255,255,.12);
    border-radius:16px;
    padding:14px 16px;
    box-shadow: 0 12px 26px rgba(0,0,0,.30);
    position:relative;
    overflow:hidden;
    transition: transform .14s ease, border-color .18s ease;
  }

  .post::before{
    content:"";
    position:absolute;
    inset:-2px;
    background: radial-gradient(520px 180px at 20% 0%, rgba(58,242,217,.10), transparent 60%);
    opacity:.9;
    pointer-events:none;
  }

  .post:hover{
    transform: translateY(-1px);
    border-color: rgba(58,242,217,.18);
  }

  .post time{
    display:block;
    font-size:.82rem;
    color: var(--muted);
    margin-top:6px;
  }

  @media (max-width:520px){
    .profile-box{ padding:34px 16px 28px; }
    .back-btn{ border-radius:12px; }
    h2{ font-size:1.75rem; }
    .profile-pic{ width:124px; height:124px; }
  }
  </style>
</head>

<body>
  <button class="back-btn" onclick="window.location.href='index.html'">← Powrót do strony głównej</button>

  <div class="profile-box">
    <img id="avatar" src="" alt="Avatar" class="profile-pic" />
    <h2 id="fullname">User</h2>
    <div id="username" class="username">@user</div>
    <button id="friend-btn" class="friend-btn" style="display:none;">Dodaj do znajomych</button>

    <div class="posts" id="posts"></div>
  </div>

  <script>

  document.addEventListener("DOMContentLoaded", async () => {
    const { data } = await supabaseClient.auth.getUser();
    const currentUser = data?.user || null;
    const viewedId = new URLSearchParams(location.search).get("id");

    if (!viewedId) return;

    if (currentUser && viewedId === currentUser.id) {
      location.href = "profile.html";
      return;
    }

    const { data: profile } = await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id", viewedId)
      .maybeSingle();

    if (!profile) {
      document.getElementById("fullname").textContent = "Nie znaleziono użytkownika";
      document.getElementById("username").textContent = "";
      return;
    }

    document.getElementById("fullname").textContent =
      (profile.first_name || "") + " " + (profile.last_name || "");
    document.getElementById("username").textContent = "@" + (profile.username || "user");
    let avatar = profile.avatar_url;
if (avatar) {
  if (!avatar.startsWith("https")) {
    avatar = `${SUPABASE_URL}/storage/v1/object/public${avatar.startsWith('/') ? '' : '/'}${avatar}`;
  }
  document.getElementById("avatar").src = avatar;
} else {
  document.getElementById("avatar").src = "images/avatar-default.png";
}
    // Relacja znajomości
const { data: rel } = await supabaseClient
  .from("friendships")
  .select("*")
  .or(`and(requester_id.eq.${currentUser.id},addressee_id.eq.${viewedId}),and(requester_id.eq.${viewedId},addressee_id.eq.${currentUser.id})`)
  .maybeSingle();

const btn = document.getElementById("friend-btn");
btn.style.display = "inline-block";

if (!rel) {
  btn.textContent = "Dodaj do znajomych";
  btn.onclick = async () => {
    btn.disabled = true;
    const { error } = await supabaseClient.from("friendships").insert({
      requester_id: currentUser.id,
      addressee_id: viewedId,
      status: "pending"
    });
    if (error) {
      btn.textContent = "Błąd";
      console.warn(error.message);
    } else {
      btn.textContent = "Wysłano zaproszenie";
    }
  };
} else if (rel.status === "pending") {
  if (rel.addressee_id === currentUser.id) {
    btn.textContent = "Akceptuj zaproszenie";
    btn.onclick = async () => {
      const { error } = await supabaseClient
        .from("friendships")
        .update({ status: "accepted" })
        .eq("id", rel.id);
      if (error) {
        btn.textContent = "Błąd";
      } else {
        btn.textContent = "Znajomi";
        btn.disabled = true;
      }
    };
  } else {
    btn.textContent = "Wysłano zaproszenie";
    btn.disabled = true;
  }
} else if (rel.status === "accepted") {
  btn.textContent = "Znajomi";
  btn.disabled = true;
}

    const { data: posts } = await supabaseClient
      .from("user_posts")
      .select("*")
      .eq("author_id", viewedId)
      .order("created_at", { ascending: false });

    const list = document.getElementById("posts");
    if (!posts?.length) {
      list.innerHTML = "<div style='opacity:.6;'>Brak postów</div>";
      return;
    }

    for (const p of posts) {
  const visible =
    p.visibility === "public" ||
    (p.visibility === "friends" && rel?.status === "accepted") ||
    viewedId === currentUser.id;

  if (!visible) continue;

  const div = document.createElement("div");
  div.className = "post";
  div.innerHTML = `<div>${p.content}</div><time>${new Date(p.created_at).toLocaleString()}</time>`;
  list.appendChild(div);
}
  });
  </script>
</body>
</html>
